name: earphone_follow_read
description: 蓝牙耳机提示词跟读训练器（端侧 ASR / TTS / 声纹 / 降噪）
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # 端侧语音全套（ASR/TTS/VAD/声纹/降噪），版本与官方 flutter-examples 一致
  sherpa_onnx: 2.0.2
  record: ^6.1.2
  audioplayers: ^6.1.0
  path_provider: ^2.1.3
  path: ^1.9.0
  shared_preferences: ^2.3.0
  file_picker: ^8.0.0
  url_launcher: ^6.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/

name: Build Android APK

# 每次 push、手动触发时云端编译 APK；产物在 Actions 页面 Artifacts 下载
on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Flutter version
        run: flutter --version

      # 本仓库只提交 lib/ 与 pubspec.yaml；平台目录由 CI 现场生成，避免提交二进制 gradle wrapper
      - name: Generate platform folders
        run: flutter create --org com.example --project-name earphone_follow_read --platforms=android .

      - name: Inject Android permissions
        shell: bash
        run: |
          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.BLUETOOTH"/>
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN"/>
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN"/>
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
              <application
                  android:label="耳机跟读训练器"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data android:name="io.flutter.embedding.android.NormalTheme" android:resource="@style/NormalTheme"/>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data android:name="flutterEmbedding" android:value="2"/>
              </application>
          </manifest>
          EOF
          echo "Manifest injected"

      - name: Set minSdkVersion
        shell: bash
        run: |
          sed -i 's/minSdkVersion 24/minSdkVersion 23/' android/app/build.gradle || true
          grep -n "minSdkVersion" android/app/build.gradle

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze (non-fatal)
        continue-on-error: true
        run: flutter analyze

      - name: Build release APK (split ABI)
        run: flutter build apk --release --split-per-abi

      - name: List APKs
        run: find build/app/outputs/flutter-apk -name "*.apk" -exec ls -lh {} \;

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: earphone-follow-read-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 90
